spring.application.name=emailintel
# ── Server
server.port=8080

# ── Database (defaults to H2 in-memory for local dev — switch to PostgreSQL via env vars)
spring.datasource.url=${DB_URL:jdbc:h2:mem:emailintel;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── ML Service
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout.ms=${ML_SERVICE_TIMEOUT:5000}

# ── Geolocation (ip-api.com free tier — no key needed)
geo.api.url=${GEO_API_URL:http://ip-api.com/json}
geo.api.key=${GEO_API_KEY:}

# ── File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging
logging.level.com.sih26106.emailintel=INFO
logging.level.org.springframework.web=WARN